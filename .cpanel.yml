deployment:
  tasks:
    - export DEPLOYPATH=/home4/tonyketter/nineonetwo.online/WORKINGCAPITAL
    # ADVISORY PHP lint. Uses the NEWEST php available (cPanel's default `php` CLI
    # is often an old version that false-fails modern syntax). NEVER aborts the
    # deploy — code is already linted before every push, and a stale lint warning
    # is far better than a bricked deploy.
    - PHPBIN="$(ls /opt/cpanel/ea-php*/root/usr/bin/php 2>/dev/null | sort -rV | head -1)"; [ -n "$PHPBIN" ] || PHPBIN="$(command -v php)"; if [ -n "$PHPBIN" ]; then echo "Linting with $PHPBIN"; find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 "$PHPBIN" -l 1>/dev/null && echo "PHP lint OK" || echo ">>> WARNING: PHP lint reported issues (deploy continues)"; else echo "no php binary; skipping lint"; fi
    # ADVISORY money-math tests — never aborts the deploy.
    - PHPBIN="$(ls /opt/cpanel/ea-php*/root/usr/bin/php 2>/dev/null | sort -rV | head -1)"; [ -n "$PHPBIN" ] || PHPBIN="$(command -v php)"; if [ -n "$PHPBIN" ] && [ -f tests/pricing_test.php ]; then "$PHPBIN" tests/pricing_test.php || echo ">>> WARNING: pricing tests reported issues (deploy continues)"; else echo "skip pricing tests"; fi
    # Copy ALL root-level PHP so new files deploy automatically. config.php /
    # mail_token.php are gitignored, so they never overwrite the live secrets.
    - /bin/cp *.php $DEPLOYPATH
    - /bin/cp .user.ini $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    # The SPA now lives in app.js/app.css (cache-busted via ?v=filemtime).
    - /bin/cp app.css $DEPLOYPATH
    - /bin/cp app.js $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH
    # Security: keep the data/ cache (Zoho token + JSON) web-denied.
    - /bin/mkdir -p $DEPLOYPATH/data && /bin/cp data/.htaccess $DEPLOYPATH/data/
